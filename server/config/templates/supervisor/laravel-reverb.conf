[program:{{DOMAIN}}-reverb]
process_name=%(program_name)s
command=php /home/deployer/sites/{{DOMAIN}}/current/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=deployer
numprocs=1
redirect_stderr=true
stdout_logfile=/home/deployer/sites/{{DOMAIN}}/shared/storage/logs/reverb.log
stopwaitsecs=10
