server {
    listen 80;
    listen [::]:80;
    server_name {{SERVER_NAMES}};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name {{SERVER_NAMES}};

    ssl_certificate /etc/letsencrypt/live/{{DOMAIN}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMAIN}}/privkey.pem;

    # OCSP stapling — serve a cached OCSP response so clients skip the CA
    # round-trip. Needs the issuer chain + a resolver (defined in nginx.conf).
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/{{DOMAIN}}/chain.pem;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /home/deployer/sites/{{DOMAIN}}/current/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 210M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy — OPT-IN, left disabled to avoid breaking
    # Inertia/Vite (inline styles, injected scripts). Roll out via Report-Only
    # first (collects violations without blocking), tune, then switch to the
    # enforcing header. If you enable a CSP, re-declare it in the static-asset
    # location below too (add_header does not inherit into a location that sets
    # its own add_header).
    # add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'" always;
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'" always;

    # Logging
    access_log /var/log/nginx/{{DOMAIN}}-access.log;
    error_log /var/log/nginx/{{DOMAIN}}-error.log;

    # Basic Auth (managed by forge-lite auth)
    include /etc/forge-lite/auth/{{DOMAIN}}.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        limit_req zone=forge_lite_global burst=20 nodelay;
        fastcgi_pass unix:{{FPM_SOCKET}};
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # nginx does not merge add_header across levels: a location with its own
        # add_header drops all server-level ones. Re-assert the security headers
        # here so static assets carry them too (HSTS in particular).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        access_log off;
    }

    # Per-site customizations (managed by site owner, empty by default).
    # add-site.sh creates an empty {{DOMAIN}}.conf; sites can append their own
    # location/limit_req_zone/add_header directives without forking the template.
    include /etc/nginx/sites-extra/{{DOMAIN}}.conf;
}
