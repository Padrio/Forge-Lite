server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Feeds the nginx-catchall Fail2Ban jail.
    access_log /var/log/nginx/forge-lite-catchall.log forge_lite_security;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Deny everything else
    location / {
        return 444;
    }
}

# Unknown SNI and direct-IP HTTPS must not fall through to the first site.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
