server {
    listen 80;
    listen [::]:80;
    server_name {{SERVER_NAMES}};

    root /home/deployer/sites/{{DOMAIN}}/current/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 210M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy — OPT-IN, left disabled to avoid breaking
    # Inertia/Vite. Roll out via Report-Only first, tune, then enforce. If you
    # enable a CSP, re-declare it in the static-asset location below too
    # (add_header does not inherit into a location that sets its own add_header).
    # add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'" always;

    # Logging
    access_log /var/log/nginx/{{DOMAIN}}-access.log;
    error_log /var/log/nginx/{{DOMAIN}}-error.log;

    # Basic Auth (managed by forge-lite auth)
    include /etc/forge-lite/auth/{{DOMAIN}}.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        limit_req zone=forge_lite_global burst=20 nodelay;
        # Lange synchrone Requests (z. B. Proposal-Generierung großer Dienstpläne)
        # brauchen >60s. nginx-Default fastcgi_read_timeout = 60s → 504. Muss
        # >= php-fpm request_terminate_timeout und >= App-set_time_limit.
        fastcgi_read_timeout 310;
        fastcgi_pass unix:{{FPM_SOCKET}};
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    # Deny dotfiles (except .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # nginx does not merge add_header across levels: a location with its own
        # add_header drops all server-level ones. Re-assert security headers here.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        access_log off;
    }

    # Per-site customizations (managed by site owner, empty by default).
    # add-site.sh creates an empty {{DOMAIN}}.conf; sites can append their own
    # location/limit_req_zone/add_header directives without forking the template.
    include /etc/nginx/sites-extra/{{DOMAIN}}.conf;
}
